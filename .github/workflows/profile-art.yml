name: Profile art

# Redraws the contribution snake and the 3D contribution graph once a day.
# Both read the public contribution calendar, which includes private-repo
# counts (profile setting "Private contributions") but never private repo names.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 in Vietnam (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-art.yml"]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  graph-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the 3D graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - name: Publish the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
