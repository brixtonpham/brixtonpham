name: Profile art

# Redraws the contribution snake, 3D contribution graph, and recent OSS activity once a day.
# Contribution graphs read the public contribution calendar (which includes private-repo
# counts via profile settings, never private repo names). Recent OSS work reads public PRs only.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 in Vietnam (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-art.yml"
      - "scripts/update_oss_activity.py"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  graph-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit the 3D graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git commit -m "Update 3D contribution graph"; then
            git pull --rebase
            git push
          fi

  oss-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Update recent open-source work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_oss_activity.py --readme README.md --user "${{ github.repository_owner }}"
      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Update recent open-source work"
            for attempt in 1 2 3; do
              if git pull --rebase --quiet && git push --quiet; then
                break
              fi
              [ "$attempt" -eq 3 ] && exit 1
              sleep $((attempt * 2))
            done
          fi

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - name: Publish the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
