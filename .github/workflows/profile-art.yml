name: Profile art

# Updates the inline merged-OSS line in README.md once a day from public GitHub PRs.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 in Vietnam (UTC+7)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-art.yml"
      - "scripts/update_oss_activity.py"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  oss-work:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Update recent open-source work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_oss_activity.py --readme README.md --user "${{ github.repository_owner }}"
      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Update recent open-source work"
            for attempt in 1 2 3; do
              if git pull --rebase --quiet && git push --quiet; then
                break
              fi
              [ "$attempt" -eq 3 ] && exit 1
              sleep $((attempt * 2))
            done
          fi
